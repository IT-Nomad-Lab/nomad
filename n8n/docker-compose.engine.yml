# Docker Engine only (#383). Turn on with COMPOSE_FILE=docker-compose.yml:docker-compose.engine.yml
# in n8n/.env, at cut-over (docs/DOCKER-ENGINE-RUNBOOK.md). Leave it off under Docker Desktop.
#
# The v2 engine posts to host.docker.internal:5678. Under Docker Engine that's the bridge gateway,
# 172.17.0.1, where a 127.0.0.1-only publish doesn't answer. Compose appends this to `ports:`.
# Still not on the LAN: WSL NAT doesn't expose the bridge.
services:
  n8n:
    ports:
      - "172.17.0.1:5678:5678"
