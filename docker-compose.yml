# Project NOMAD — full stack
# Bring up:  docker compose up -d
# Service/port map is in README.md. Secrets come from .env (never commit it).
name: nomad

# host.docker.internal for every service (#383). Docker Desktop defines the name itself; Docker
# Engine needs it spelled out. `host-gateway` is the daemon's bridge gateway: 172.17.0.1, pinned by
# "bip" and "host-gateway-ip" in docs/docker-engine/daemon.json. Host-native services listen there
# as well as on loopback (NOMAD_BRIDGE_IP in their units). Set NOMAD_HOST_GATEWAY only to override.
x-host-gateway: &host-gateway
  - "host.docker.internal:${NOMAD_HOST_GATEWAY:-host-gateway}"

services:
  # ── Local models ───────────────────────────────────────────────────
  # NOTE: Ollama runs NATIVELY on Windows (not in Compose), already on the
  # RTX 5090 with ~95 GB of models. Containers reach it at
  # host.docker.internal:11434 (see litellm/config.yaml). Nothing to start here.

  # ── The gateway / router (single endpoint for every brain) ─────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nomad-litellm
    extra_hosts: *host-gateway
    ports:
      # localhost only: the gateway carries every cloud API key and answers
      # with the master key alone. Containers use http://litellm:4000 over the
      # compose network; host-native callers already use 127.0.0.1:4000.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Fallback alert callback, beside the config so LiteLLM resolves it, and the Zulip bot
      # credentials the relay and nomad-watch already use. See litellm/fallback_alert.py.
      - ./litellm/fallback_alert.py:/app/fallback_alert.py:ro
      - ${HOME}/.config/nomad/zulip-bot.zuliprc:/run/nomad/zulip-bot.zuliprc:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      - NOMAD_ZULIPRC=/run/nomad/zulip-bot.zuliprc
      # Zulip is on the host loopback; host.docker.internal reaches it (see CLAUDE.md).
      - NOMAD_FALLBACK_ZULIP_URL=http://host.docker.internal:8096
    restart: unless-stopped

  # ── Chat UI + voice + mobile PWA ───────────────────────────────────
  openwebui:
    # Pinned: owui/nomad_pipe.py, nomad_filter.py and nomad_ui.js are written against this
    # release (0.12.3). To upgrade, check the function API and the loader.js hook, bump
    # required_open_webui_version, then the digest (#1119, #1137).
    image: ghcr.io/open-webui/open-webui@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
    container_name: nomad-openwebui
    extra_hosts: *host-gateway
    ports:
      - "127.0.0.1:3000:8080"   # host-only; a browser on this machine is the only client
    volumes:
      - openwebui:/app/backend/data
      # The Project dropdown (docs/prd/owui-sessions.md §6.5). index.html loads
      # /static/loader.js, shipped empty; Open WebUI copies this path into its static dir at start.
      - ./owui/nomad_ui.js:/app/build/static/loader.js:ro
      # The NOMAD logo (#1218), rendered by owui/brand/render.py. Self-hosted with <=50 users,
      # so Open WebUI's licence allows the rebrand (docs.openwebui.com/license).
      - ./owui/brand/static/favicon.png:/app/build/favicon.png:ro
      - ./owui/brand/static/favicon.png:/app/build/static/favicon.png:ro
      - ./owui/brand/static/favicon-96x96.png:/app/build/static/favicon-96x96.png:ro
      - ./owui/brand/static/favicon.ico:/app/build/static/favicon.ico:ro
      - ./owui/brand/static/favicon.svg:/app/build/static/favicon.svg:ro
      - ./owui/brand/static/logo.png:/app/build/static/logo.png:ro
      - ./owui/brand/static/splash.png:/app/build/static/splash.png:ro
      - ./owui/brand/static/splash-dark.png:/app/build/static/splash-dark.png:ro
      - ./owui/brand/static/apple-touch-icon.png:/app/build/static/apple-touch-icon.png:ro
      - ./owui/brand/static/web-app-manifest-192x192.png:/app/build/static/web-app-manifest-192x192.png:ro
      - ./owui/brand/static/web-app-manifest-512x512.png:/app/build/static/web-app-manifest-512x512.png:ro
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Signup stays off: a chat can write to nomad-pm (M2). The DB setting already says so;
      # this keeps a fresh volume the same.
      - ENABLE_SIGNUP=false
    depends_on:
      - litellm
    restart: unless-stopped

  # ── Vector memory ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nomad-qdrant
    extra_hosts: *host-gateway
    ports:
      - "127.0.0.1:6333:6333"   # localhost only: Qdrant has NO auth and holds every conversation turn
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

  # ── State / relational memory (also backs n8n) ─────────────────────
  postgres:
    image: postgres:16
    container_name: nomad-postgres
    extra_hosts: *host-gateway
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Page checksums for a FRESH cluster only: initdb reads this once, on an empty volume. The
      # existing `nomad_postgres` volume ignores it; converting that one is offline work, see
      # docs/CUTOVER-RUNBOOK.md "Postgres page checksums".
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  # ── NOMAD v2: mission control / inbox / source of truth (on existing Postgres) ──
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nomad-nocodb
    extra_hosts: *host-gateway
    ports:
      - "127.0.0.1:8095:8080"   # http://localhost:8095  (host-only)
    environment:
      - NC_DB=pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nomad_v2
      - NC_PUBLIC_URL=http://localhost:8095
      - NC_DISABLE_TELE=true
    depends_on:
      - postgres
    restart: unless-stopped

  # ── NOMAD v2 engine: pipeline state machine + cockpit + gate (managed service) ──
  nomad-v2-engine:
    build:
      context: ./v2
      # nomad_projects (the shared creation module, #1372) lives at the repo root, outside the
      # v2 context; the Dockerfile copies it in with COPY --from=nomad_projects.
      additional_contexts:
        nomad_projects: ./nomad_projects
    container_name: nomad-v2-engine
    extra_hosts: *host-gateway
    ports:
      - "127.0.0.1:8099:8099"   # cockpit/API host-only; reachable internally as nomad-v2-engine:8099
    env_file: .env              # NC_API_TOKEN, LITELLM_MASTER_KEY, OPERATOR_EMAIL, …
    environment:
      - NOMAD_RUNTIME=litellm                                  # SDK runtime is host/dev (see Dockerfile)
      - NOMAD_V2_ENGINE_HOST=0.0.0.0
      # tailnet by default: local requests behave as with `off`, and only the operator's login
      # gets in through `tailscale serve` on 8449 (#795). v2/publish.sh sets `on` in the shell for
      # one `up -d`. Not in .env on purpose: a login that is on by default is a login that gets
      # turned off locally and left off.
      - NOMAD_AUTH_MODE=${NOMAD_AUTH_MODE:-tailnet}
      # Both from .env. Left unset, nothing is served through the proxy (503), and local is unchanged.
      - NOMAD_TAILNET_OPERATOR=${NOMAD_TAILNET_OPERATOR:-}
      - NOMAD_TAILNET_ORIGIN=${NOMAD_TAILNET_ORIGIN:-}
      - NC_BASE_URL=http://nocodb:8080                         # NocoDB on the compose network
      - NOMAD_PG_HOST=postgres                                 # push gate: LISTEN/NOTIFY
      - NOMAD_PG_DB=nomad_v2
      - LITELLM_BASE_URL=http://litellm:4000
      - N8N_V2_SEND_URL=http://host.docker.internal:5678/webhook/v2-send  # standalone n8n
      - NOMAD_DISPATCH_URL=http://host.docker.internal:8090               # dev lane → Builder (native dispatcher)
      - NOMAD_AUTOPILOT_URL=http://host.docker.internal:8092              # autopilot supervisor (#882); its token comes from /term-secret/autopilot-token
      - NOMAD_AGENT_BRIDGE_URL=http://172.17.0.1:8093                     # agent bridge (#1363): pending asks; token = owui-token via /term-secret
      - NOMAD_VOICE_URL=http://host.docker.internal:8200                           # 3D: local Piper/Whisper
      - NOMAD_TERM_URL=ws://host.docker.internal:8091                     # interactive project terminal (PTY daemon)
      - QDRANT_URL=http://qdrant:6333                                     # cockpit chat memory (unified w/ console)
      - OLLAMA_URL=http://host.docker.internal:11434                      # embeddings (nomic-embed-text)
      - NOMAD_SCRAPER_URL=http://nomad-scraper:8210                       # research lane → web scrape/search (fast static + SearXNG; browser+LLM fallback)
      - NOMAD_AUDIO_URL=http://host.docker.internal:8220                  # local music generation (ACE-Step, host-native GPU service)
      - NOMAD_KROKI_URL=http://kroki:8000                                 # render diagrams/charts from text (Kroki: mermaid/graphviz/d2/vega-lite)
      # ── image generation (gated): local ComfyUI first, then OpenAI, then Adobe Firefly ──
      - NOMAD_IMAGE_PROVIDER=comfyui,openai,firefly
      # ComfyUI runs via the dispatcher's /comfy/generate under shared GPU admission (#1462)
      - COMFYUI_MODEL=${COMFYUI_MODEL:-sdxl}                              # set in .env: sdxl (fast default) | flux (FLUX.1 schnell) | flux2 (best quality, slow, non-commercial) | qwen (best text, Apache-2.0)
      - COMFYUI_FLUX2_CLIP=${COMFYUI_FLUX2_CLIP:-mistral_3_small_flux2_fp8.safetensors}  # fp8 (17GB) not bf16 (34GB) — bf16 OOM-kills ComfyUI on a 24GB card; fp4_mixed (~12GB) for tighter RAM
      - OPENAI_IMAGE_MODEL=gpt-image-1                                    # OpenAI Images (uses OPENAI_API_KEY)
      - NOMAD_IMAGE_DIR=/app/generated_images
      - NOMAD_PROMPTS_DIR=/app/prompts                  # named prompt registry (JDE_STYLE etc.)
      # PM-01 P3: where projects live. nocodb (mc_goals/milestones/tasks) or openproject (nomad-pm,
      # Feature > Epic > Task in NOMAD_PM_PROJECT). Tokens come from /term-secret below.
      - NOMAD_PM=${NOMAD_PM:-nocodb}
      - NOMAD_PM_URL=http://host.docker.internal:8097
      - NOMAD_PM_PROJECT=nomad-work
      # PM-01 P4: OpenProject's signed webhook lands on /pm-hook (secret in
      # /term-secret/openproject-webhook.secret, made by ~/nomad-pm/seed.sh). The operator is
      # OpenProject user 4; their watches and @mentions reach Zulip. Links in Zulip use the public URL.
      - NOMAD_PM_OPERATOR_ID=${NOMAD_PM_OPERATOR_ID:-4}
      - NOMAD_PM_PUBLIC_URL=${NOMAD_PM_PUBLIC_URL:-http://localhost:8097}
    volumes:
      - /home/jdelimam/.config/nomad:/term-secret:ro   # read the terminal daemon's shared token
      # nomad-watch's own results, read-only. The engine reports them; it does not probe.
      - /home/jdelimam/.local/state/nomad-watch:/watch-state:ro
      - ./v2/generated_images:/app/generated_images    # persisted generated images (served at /images)
      - ./prompts:/app/prompts:ro                       # house voice + shared prompt blocks (single source of truth)
    deploy:                    # GPU so the cockpit reads nvidia-smi itself instead of asking the v1 console
      resources:              # a reservation makes the device visible; it does not hold VRAM
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - nocodb
      - litellm
      - postgres
      - qdrant
      - nomad-scraper
    restart: unless-stopped

  # ── Automation + integrations + APPROVAL GATES ─────────────────────
  # DISABLED 2026-09-18, container + volume DELETED 2026-09-23. The authoritative n8n is the
  # STANDALONE one in nomad/n8n/ — it holds the encryption key, every workflow and every attached
  # credential. This full-stack copy could not resolve `postgres` and crash-looped 8228 times.
  # The profile alone did not park it: the restart policy lives on the CONTAINER, so `unless-stopped`
  # brought it back after every engine restart no matter what this file said. Hence `restart: "no"`
  # below, and no host port publish: it declared 5678, the same port as the real n8n, so on a boot
  # it won it would have bound the port and kept the real one from starting.
  # Its old `nomad_n8n` volume held nothing but an encryption key it generated for itself —
  # a revive starts EMPTY. To bring it back:  docker compose --profile fullstack-n8n up -d n8n
  n8n:
    profiles: ["fullstack-n8n"]
    image: n8nio/n8n:latest
    container_name: nomad-n8n
    extra_hosts: *host-gateway
    # No `ports:` on purpose — see above. Reach it on the compose network, or publish to a
    # DIFFERENT host port (e.g. "127.0.0.1:5679:5678") if it is ever genuinely needed.
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n:/home/node/.n8n
    depends_on:
      - postgres
    restart: "no"   # never loop: this is the copy that crash-looped 8228 times

  # ── Local voice (nomad-voice): real-time interruptible conversation + TTS/STT/wake ─
  # Runs HOST-NATIVE (the real-time WebRTC needs direct networking) via systemd —
  # nomad-voice/install_service.sh, on 127.0.0.1:8200. NOT a compose service; the engine/console
  # reach it at host.docker.internal:8200 (see NOMAD_VOICE_URL above).

  # ── Web scraping: ScrapeGraphAI behind HTTP (LLM-driven scrape/search) ─
  nomad-scraper:
    build: ./nomad-scraper
    container_name: nomad-scraper
    extra_hosts: *host-gateway
    ports:
      - "127.0.0.1:8210:8210"   # host-only; engine reaches it on the compose network
    env_file: .env              # LITELLM_MASTER_KEY (+ optional OPENAI/GEMINI keys via aliases)
    environment:
      - LITELLM_BASE_URL=http://litellm:4000   # LLM via the gateway (only used for distill/fallback)
      - SCRAPER_MODEL=${SCRAPER_MODEL:-fast}    # LOCAL/free default; fast static path skips the LLM anyway. gpt for hard extraction
      - SEARXNG_URL=http://searxng:8080         # self-hosted metasearch (no keys); ddgs fallback
      - OLLAMA_URL=http://host.docker.internal:11434  # embeddings (heavy fallback only)
    depends_on:
      - litellm
      - searxng
    restart: unless-stopped

  # ── Kroki: render diagrams + charts from text (deterministic, auto-layout) ──
  # One engine for Mermaid/Graphviz/D2/PlantUML (diagrams) + Vega-Lite (charts). No image model:
  # agents emit the spec, Kroki lays it out perfectly (no misplaced arrows / text overflow).
  kroki:
    image: yuzutech/kroki
    container_name: nomad-kroki
    extra_hosts: *host-gateway
    depends_on:
      - kroki-mermaid
    environment:
      - KROKI_MERMAID_HOST=kroki-mermaid
    ports:
      - "127.0.0.1:8231:8000"          # host-only; the render tool posts here
    tmpfs:
      - /tmp:exec
    restart: unless-stopped

  kroki-mermaid:
    image: yuzutech/kroki-mermaid
    container_name: nomad-kroki-mermaid
    extra_hosts: *host-gateway
    expose:
      - "8002"
    restart: unless-stopped

  # ── SearXNG: self-hosted metasearch backing nomad-scraper /search (no API keys) ──
  searxng:
    image: searxng/searxng:latest
    container_name: nomad-searxng
    extra_hosts: *host-gateway
    ports:
      - "127.0.0.1:8211:8080"          # host-only (debug); scraper reaches it as searxng:8080
    volumes:
      # mount ONLY our settings file (read-only) — mounting the whole dir :rw lets SearXNG
      # root-own the tracked repo folder. uwsgi.ini etc. stay in the image.
      - ./nomad-scraper/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    restart: unless-stopped

volumes:
  openwebui:
  qdrant:
  postgres:
  n8n:
