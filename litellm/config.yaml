# Project NOMAD — LiteLLM routing config
# Interfaces & agents ask for a ROLE alias; the gateway maps it to a real
# model and falls back automatically. Swap models HERE only — never wire a
# raw model name into an app.
#
# ⚠ Verify every cloud model string and every Ollama tag against current
#   provider docs before relying on them (names drift — see CLAUDE.md).
#
# Prompts live in the REGISTRY, not here. This file routes MODELS; named prompt
# blocks (e.g. JDE_STYLE — the house writing voice) live in ../prompts/ and are
# called by name: prompts.get_prompt("JDE_STYLE"). Keep prompts out of routing.

model_list:
  # ── Local (NATIVE Windows Ollama, reached via host.docker.internal) ─
  # Tags remapped 2026-05-31 to models actually installed (the spec's
  # qwen3.6:* tags don't exist). `docker exec`/`ollama list` to see options.
  # 2026-10-04 (#1039): was llama3.1:8b. Qwen3.5-9B Heretic (KL 0.024), a local tag made from
  # hf.co/llmfan46/Qwen3.5-9B-ultra-uncensored-heretic-GGUF:Q4_K_M with num_ctx 8192 and only the
  # two real stop tokens (the GGUF's own set included "<think>"). Thinking off: on, it runs to
  # thousands of tokens. A/B in docs/research/1039-fast-ab: better on JSON, tools, math and
  # spoken replies, 0.9 s median voice turn vs 1.1. 5.3 GB. Rollback: ollama/llama3.1:8b.
  - model_name: fast            # always-on workhorse: quick Q&A, voice, extraction
    litellm_params:
      model: ollama_chat/qwen3.5-heretic:9b
      api_base: http://host.docker.internal:11434
      think: false

  # 2026-09-15: was deepseek-r1:32b. qwen3.6 scored the same (7/8) on the
  # ~/vendor/colibri-bench quality set at ~20x the speed, and fits the 5090 at 8k ctx.
  # Needs ~22 GB VRAM: it evicts ComfyUI / nomad-detect when it loads.
  # 2026-10-04 (#1029): now the Heretic build of the same model (refusals 83 -> 10/100, KL 0.0015),
  # a local Ollama tag made from hf.co/llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-
  # Preserved-GGUF:Q4_K_M with draft_num_predict 0. MTP drafting (draft_num_predict 2, the stock
  # tag's default) ran at ~15 tok/s on Ollama 0.35; off, ~80. Rollback: qwen3.6:35b-a3b.
  - model_name: private         # local reasoning, privacy-sensitive, offline
    litellm_params:
      model: ollama_chat/qwen3.6-heretic:35b-a3b
      api_base: http://host.docker.internal:11434
      num_ctx: 8192
      think: false

  # 2026-10-04 (#1046): local image understanding (IG frames for nomad-social). Qwen3-VL-8B
  # abliterated (Huihui), Q8_0 on llama.cpp :8241 with the vision encoder on CUDA, on demand
  # (llama/qwen3vl.sh start). Ollama's packaging of the same weights runs the encoder on the CPU
  # (105 s for one large photo), so it is only the fallback, `vision-ollama`. Fallbacks stay
  # image-capable: a text-only one "analyses" frames it never saw. nomad-social disables
  # fallbacks and runs its own chain (vision, longdoc, gpt).
  - model_name: vision          # local vision: frames, screenshots, slides
    litellm_params:
      model: hosted_vllm/qwen3-vl-8b
      api_base: http://host.docker.internal:8241/v1
      api_key: "sk-llama-noauth"
      timeout: 600
  - model_name: vision-ollama   # always-loadable fallback for `vision` (CPU encoder: slow on big images)
    litellm_params:
      model: ollama_chat/huihui_ai/qwen3-vl-abliterated:8b-instruct-q8_0
      api_base: http://host.docker.internal:11434
      num_ctx: 32768
      timeout: 600

  # 2026-10-04 (#1045): Qwen3.8-27B + MTP on llama.cpp :8240, on demand (llama/qwen38.sh start).
  # While :8240 is down, `code` falls back to code-ollama. Rollback: point `code` at
  # ollama/qwen3-coder:30b. Setup and measurements: docs/prd/local-code-llamacpp.md.
  - model_name: code            # local coding / refactors / agentic tool use
    litellm_params:
      model: hosted_vllm/qwen3.8-27b
      api_base: http://host.docker.internal:8240/v1
      api_key: "sk-llama-noauth"              # llama-server runs without auth (local only)
      timeout: 600

  - model_name: code-ollama     # always-loadable fallback for `code`, and FIM autocomplete
    litellm_params:              # 2026-10-16 (#1408): was qwen2.5-coder:32b
      model: ollama/qwen3-coder-fim:30b    # stock tag + FIM template: ollama/qwen3-coder-fim.Modelfile
      api_base: http://host.docker.internal:11434

  # 2026-10-16 (#1408): extra local models, picked by name in Open WebUI. No lane routes here
  # and no fallback names them. Each loads on demand and evicts `private` from VRAM.
  # gpt-oss: its harmony tool format breaks behind converting proxies (see
  # docs/research/local-abliterated-models.md), so chat only, no agentic tool use.
  - model_name: devstral        # Mistral Devstral Small 2 (24B, 2512), coding agent
    litellm_params:
      model: ollama_chat/devstral-small-2:24b
      api_base: http://host.docker.internal:11434

  - model_name: glm-flash       # Z.ai GLM-4.7-Flash (30B MoE, ~3.6B active)
    litellm_params:
      model: ollama_chat/glm-4.7-flash
      api_base: http://host.docker.internal:11434

  - model_name: gpt-oss         # OpenAI gpt-oss-20b (21B MoE, 3.6B active)
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://host.docker.internal:11434

  - model_name: longdoc-local   # private long documents (64k ctx), same server as `code`.
    litellm_params:              #   No fallback on purpose: falling back to Gemini would send a
      model: hosted_vllm/qwen3.8-27b          #   private document to the cloud. Down = error.
      api_base: http://host.docker.internal:8240/v1
      api_key: "sk-llama-noauth"
      timeout: 900

  # ── Cloud (routed only when worth it) ───────────────────────────
  # deep/balanced are served by LOCAL Claude Code (subscription, NOT the
  # Anthropic API) via the native claude-bridge. See claude-bridge/bridge.py.
  - model_name: deep            # deep reasoning, agentic, architecture → Opus
    litellm_params:
      model: openai/opus
      api_base: http://host.docker.internal:8088/v1
      api_key: "sk-bridge-noauth"             # bridge ignores auth (local only)

  - model_name: balanced        # everyday cloud reasoning / long-form drafts → Sonnet
    litellm_params:
      model: openai/sonnet
      api_base: http://host.docker.internal:8088/v1
      api_key: "sk-bridge-noauth"

  - model_name: codex           # backup agentic brain → OpenAI Codex CLI on the ChatGPT
    litellm_params:                #   subscription, via the native codex-bridge. A SECOND
      model: openai/codex          #   vendor, so a Claude 5-hour throttle no longer drops
      api_base: http://host.docker.internal:8089/v1   # the whole stack to llama3.1:8b.
      api_key: "sk-bridge-noauth"             # bridge ignores auth (local only)

  - model_name: gpt             # alt reasoning, strong function-calling, vision
    litellm_params:
      model: openai/gpt-4o                    # verify tag
      api_key: os.environ/OPENAI_API_KEY

  - model_name: longdoc         # huge-context jobs, multimodal
    litellm_params:
      model: gemini/gemini-2.5-flash          # 1M context, multi-image. 2.5-pro 404s for new users (2026-10-03)
      api_key: os.environ/GEMINI_API_KEY

  # ── NVIDIA NIM (free tier) — ACTIVE AS A HAND-CALLED BENCH TOOL ONLY ──────────────
  # ⛔ DO NOT PUT THESE IN A FALLBACK CHAIN. They are defined so a human or an eval script
  #    can ask for them BY NAME. Nothing routes here automatically, and that is the whole
  #    basis on which this is permitted to exist. Operator decision, 2026-09-22 (ADR-010
  #    option 2). Read docs/adr/ADR-010-nvidia-nim-free-tier.md before touching this block.
  # Short version of what the checks found:
  #
  #   ⛔ The NVIDIA API Trial ToS §1.2/§1.4 allow "internal testing and evaluation purposes,
  #      NOT in production". A LiteLLM fallback chain in a running orchestrator IS production
  #      use, so wiring these into the chains is REJECTED on the terms, not on quality. The
  #      two commented `fallbacks` lines below stay commented, permanently. Hand-calling
  #      `nim` for evaluation is what §1.4 does allow, and that is the ONLY sanctioned use.
  #   ⛔ ToS §3.3(iv) lets NVIDIA train on inputs AND outputs, with no opt-out. §4.3 forbids
  #      uploading personal data outright. So: NEVER route client work, personal mail, the
  #      nomad-detect corpus, or the comms/support lanes here. Synthetic/public data only.
  #   ⚠ Rate limits exist, vary per model, and NVIDIA does not publish them. The "40 RPM" figure
  #      on third-party blogs has no primary source. Your real limit shows in build.nvidia.com.
  #   ⚠ A wrong ID fails at CALL time, not at startup, so it fails inside a real run.
  #
  # ⚠⚠ NEITHER the docs site NOR `GET /v1/models` tells you what this account can call. The
  #     listing returns 82 models; many of them 404 "Not found for account" when actually
  #     called. The original placeholder `meta/llama-3.3-70b-instruct` is 410 Gone (EOL
  #     2026-08-26). ALWAYS re-probe with a real chat completion before relying on an id.
  #
  # The two ids below were verified callable and CORRECT on our key on 2026-09-22. That is a
  # snapshot, not a guarantee: models here get retired without notice.
  #
  # IF activating as a hand-called bench tool only (ADR-010 option 2), uncomment the blocks,
  # leave the fallbacks commented, then:
  #   docker compose up -d --force-recreate litellm   (NEVER `restart`: the bind-mount gotcha
  #   in CLAUDE.md drops the config file).
  #
  - model_name: nim             # ⚠ EVAL ONLY. No lane routes here, no fallback names it.
    litellm_params:
      model: openai/nvidia/nemotron-3-super-120b-a12b   # verified callable 2026-09-22, 4.0s
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
    # ⚠ Most models here are reasoning models and reasoning tokens count against max_tokens.
    #   A generous ceiling is NOT enough: measured at max_tokens=400, z-ai/glm-5.3-flash
    #   returned an EMPTY string and nemotron-3.5-lightning returned 1893 chars of raw
    #   scratchpad as its answer. Neither is flagged in the payload; both look like HTTP 200.
    #   ALWAYS treat empty content as a failure, never as an answer.
    # Alternates, also clean at 400 tokens: deepseek-ai/deepseek-v4.1-flash (10.4s),
    #   openai/gpt-oss-20b (15.6s). Do NOT substitute an unprobed id: kimi-k3 and glm-5.3
    #   time out entirely, and several listed ids 404 for this account.

  - model_name: nim-vision      # ⚠ EVAL ONLY. 11B is the ONLY vision model callable on our key:
    litellm_params:             #   90b-vision timed out at 120s and 300s; vila/neva/phi-3-vision
      model: openai/meta/llama-3.2-11b-vision-instruct   #   /fuyu all 404 for this account.
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
    # ⚠ Any vision call MUST set disable_fallbacks and check the served model name, or a
    #   text-only fallback returns a confident description of frames it never saw. See the
    #   same guard in nomad-social/analyze.py. Prove it with an image containing an
    #   unguessable token, the way ADR-010 did; a plausible answer is not evidence.

# NOTE: the "image" role (Adobe Firefly) is NOT an LLM and is NOT routed here.
# It is a media engine called from n8n / crew/tools/firefly_tool.py.

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  # Every cloud/subscription alias ends with `fast` (local, always-on Ollama) as the
  # last resort, so NOMAD keeps answering even if the subscription throttles AND cloud
  # is down. deep→balanced first (cheaper bridge model), then `codex` — a DIFFERENT
  # vendor's subscription, so one throttled account doesn't take the others with it —
  # then local. `code` tries codex first: it is a coding agent.
  # #960: `gpt` (a paid API key) is in NO chain. It stays defined above, and only a caller that
  # asks for `gpt` by name reaches it: never automatic, never a fallback. The operator's rule is
  # no paid usage beyond the plans. autopilot/test_no_paid_fallback.py holds it.
  fallbacks:
    - deep: ["balanced", "codex", "fast"]
    - balanced: ["codex", "fast"]
    - codex: ["balanced", "fast"]
    - gpt: ["balanced", "codex", "fast"]
    - longdoc: ["codex", "fast"]
    - fast: ["private"]
    - code: ["code-ollama", "codex", "fast"]
    - vision: ["vision-ollama"]
    # T0.1: these two lines stay COMMENTED PERMANENTLY. Routing a lane to `nim` makes it
    # production use, which the NVIDIA trial terms forbid (§1.2/§1.4). Kept only so nobody
    # re-derives the idea and wires it. See docs/adr/ADR-010-nvidia-nim-free-tier.md.
    # - longdoc: ["nim-vision", "gpt", "codex", "fast"]     # ⛔ DO NOT ENABLE
    # - nim: ["gpt", "codex", "fast"]                        # ⛔ DO NOT ENABLE

litellm_settings:
  drop_params: true
  # success_callback: ["langfuse"]   # enable later for observability
  # Zulip #alerts > litellm-fallback when a Claude alias (deep, balanced) is served by codex or a
  # local model. Resolved next to this file: docker-compose mounts it at /app/fallback_alert.py.
  # Test it: docker exec nomad-litellm python /app/fallback_alert.py --test-alert
  callbacks: fallback_alert.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
