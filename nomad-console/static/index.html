<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOMAD · Mission Monitor</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#ffb000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOMAD">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/lcars.css">
  <link rel="stylesheet" href="/static/vendor/xterm.css">
</head>
<body>
<div id="frame">

  <!-- top bar -->
  <header id="topbar">
    <div class="title">NOMAD<span class="sub">MISSION MONITOR</span></div>
    <div class="readout">
      <span class="lab">UPTIME</span><span id="rail-uptime">—</span>
      <span class="lab">UTC</span><span id="clock">—</span>
    </div>
    <div id="need" class="need ok">● ALL NOMINAL</div>
  </header>

  <div id="body">

    <!-- the monitor: projects-first, sorted by what needs you -->
    <main id="dash">
      <section class="panel span-all" id="p-projects">
        <h2 class="c-orange">PROJECTS <span class="hint">sorted by what needs you</span>
          <button id="mon-refresh" title="rescan repos">↻</button></h2>
        <div class="pbody" id="monitor"><div class="muted">scanning repositories…</div></div>
      </section>

      <section class="panel" id="p-gate">
        <h2 class="c-red">HUMAN GATE <span id="gate-count" class="pill">0</span></h2>
        <div class="pbody scroll" id="approvals"><div class="muted">…</div></div>
      </section>

      <section class="panel" id="p-health">
        <h2 class="c-amber">SYSTEMS</h2>
        <div class="pbody" id="systems"><div class="muted">scanning…</div></div>
        <div class="pbody tele" id="telemetry"></div>
        <div class="pbody tele" id="gpu"></div>
      </section>
    </main>

    <!-- NOMAD comms / chat (unchanged) -->
    <aside id="comms">
      <h2 class="c-amber">NOMAD // COMMS</h2>
      <div id="chatlog"></div>
      <div id="chatbar">
        <select id="model" title="reasoning core">
          <option value="deep">DEEP · Opus</option>
          <option value="balanced">BALANCED · Sonnet</option>
          <option value="fast">FAST · local</option>
          <option value="gpt">GPT</option>
          <option value="longdoc">LONGDOC · Gemini</option>
        </select>
        <button id="mic" title="push to talk (local Whisper)" aria-label="Microphone">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/></svg>
        </button>
        <button id="wake" title="always-on wake word: say “Hey Jarvis …”" class="off" aria-label="Wake word">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.8a5 5 0 0 0 0 6.4"/><path d="M15.5 8.8a5 5 0 0 1 0 6.4"/><path d="M6 6a9 9 0 0 0 0 12"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>
        </button>
        <button id="tts" title="spoken replies (local voice)" class="off" aria-label="Speaker">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button id="live" title="live voice — real-time, interruptible conversation (barge-in)" class="off" aria-label="Live voice">
          <svg viewBox="0 0 24 24"><line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="6" x2="8" y2="18"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="16" y1="6" x2="16" y2="18"/><line x1="20" y1="10" x2="20" y2="14"/></svg>
        </button>
      </div>
      <audio id="rt-audio" autoplay style="display:none"></audio>
      <form id="chatform" autocomplete="off">
        <input id="chatin" placeholder="Address NOMAD…" autocomplete="off">
        <button type="submit" id="send">SEND</button>
      </form>
    </aside>

  </div>
</div>

<!-- PROJECT WORKSPACE: full interactive claude session in the selected repo (PTY over WS) -->
<div id="workspace" class="ws-hidden">
  <header id="ws-bar">
    <span class="ws-title">PROJECT WORKSPACE</span>
    <span id="ws-project" class="ws-project">—</span>
    <span id="ws-status" class="ws-status">●</span>
    <span class="ws-spacer"></span>
    <button id="ws-reconnect" title="reconnect the session">RECONNECT</button>
    <button id="ws-close" title="close (the claude session keeps running)">✕ CLOSE</button>
  </header>
  <div id="ws-term"></div>
</div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/workspace.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
