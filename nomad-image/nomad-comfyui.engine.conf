# Drop-in for nomad-comfyui.service, Docker Engine only (#383). Install at cut-over:
#   mkdir -p ~/.config/systemd/user/nomad-comfyui.service.d
#   cp nomad-image/nomad-comfyui.engine.conf ~/.config/systemd/user/nomad-comfyui.service.d/engine.conf
# ComfyUI has no auth: loopback, plus the Docker bridge gateway the v2 engine reaches as
# host.docker.internal:8188. Never 0.0.0.0. ComfyUI binds without IP_FREEBIND, so if it starts
# before docker0 exists the bind fails and Restart=on-failure tries again in 5 s.
[Service]
ExecStart=
ExecStart=%h/ComfyUI/venv/bin/python %h/ComfyUI/main.py --listen 127.0.0.1,172.17.0.1 --port 8188 --disable-pinned-memory --cache-none
